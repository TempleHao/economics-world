name: Verify W04L02 delayed review
on:
  pull_request:
    paths:
      - 'index.html'
      - 'site.js'
      - 'lessons/w04-l02-tax-deadweight-loss.html'
      - 'scripts/test-w04l02-review.mjs'
      - '.github/workflows/verify-w04l02-review.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site.js'
      - 'lessons/w04-l02-tax-deadweight-loss.html'
      - 'scripts/test-w04l02-review.mjs'
      - '.github/workflows/verify-w04l02-review.yml'
  workflow_dispatch:
jobs:
  review-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: W04L02 delayed review regression
        run: node scripts/test-w04l02-review.mjs
